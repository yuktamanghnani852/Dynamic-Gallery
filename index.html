<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <head>
    <style>
        .container{
            height: 600px;
            border: 1px solid black;
            display: flex;
        } 
        .box{
            height: 100%;
            width: 25%;
            border: 1px solid black;
        }
        .img{
            width: 100%;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align ="center">Dynamic gallery</h1>
    <div class="container">
   
        <div class="box 1">
            <img src="img1.png.png"alt="">
            <img src="img2.png.png"alt="">
            <img src="img3.png.png"alt="">
            <img src="img4.png.png"alt="">
        </div>
        <div class="box 2">
           <img src="img4.png.png"alt="">
            <img src="img2.png.png"alt="">
            <img src="img1.png.png"alt="">
            <img src="img3.png.png"alt="">
        </div>
        <div class="box 3">
            <img src="img3.png.png"alt="">
            <img src="img1.png.png"alt="">
            <img src="img4.png.png"alt="">
            <img src="img2.png.png"alt="">
        </div>
        <div class="box 4">
            <img src="img2.png.png"alt="">
            <img src="img4.png.png"alt="">
            <img src="img1.png.png"alt="">
            <img src="img3.png.png"alt="">
    </div>
    </div>


</body>
</html>
